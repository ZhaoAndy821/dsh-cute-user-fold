# dsh-cute-user-fold bundle patch
#
# The `dsh.bundle.patch` layer of this package. Installing with the official CLI
#
#   dsh plugin --profile web add <path-to-this-package>
#
# aligns `dsh.profile.bundles` with the installed packages; when it sees this
# declaration it appends `dsh-cute-user-fold` to the bundle stack, and the profile
# merges this patch at startup (that is the single insert below).
#
# ⚠️ The `id` here is the **cordis loader row id** (a host-side namespace) — a short
#    name is fine, and it is **unrelated** to the value of `id` passed to
#    `__ModuleLoader__.load({ id })` in `lib/client.js`. The correct value there is the
#    **package name** (`name` in `package.json`); the contract is documented in the
#    `dsh-client-plugin-css` skill, section "the two easiest configuration traps".
#    The two are deliberately different, not a typo. Getting the registration key wrong
#    is a **hard failure**: the browser reports
#    `bundle … loaded without registering "<package name>"` and the whole plugin tree
#    fails to load.
#
# ⚠️ This package exposes no tunable parameters (fold height and button label are all
#    built in). Hence there is deliberately **no `config:`** here.
- insert:
    - id: cute-user-fold
      name: 'dsh-cute-user-fold'
